<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/webp" href="/brand/hiatlas-light-192.webp" />
    <title>HiAtlas — Um novo horizonte para o seu negócio</title>
    <meta
      name="description"
      content="Uma plataforma empresarial modular que conecta operação, pessoas e dados para transformar informação em decisão."
    />
    <script>
      var t = null;
      try {
        t = localStorage.getItem("hiatlas-theme");
      } catch (e) {}
      document.documentElement.dataset.theme =
        t === "light" || t === "dark"
          ? t
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
